name: DIA Email Agent

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_reprocess_keyword:
        description: 'Optional: re-process any past email whose subject contains this text (leave blank for a normal run)'
        required: false
        default: ''
      full_reprocess:
        description: 'Set to true to wipe ALL history and re-process every email from scratch (heavy - use sparingly)'
        required: false
        default: 'false'
      email_limit_override:
        description: 'Optional: process this many emails this run instead of the default (e.g. 60 for a catch-up run)'
        required: false
        default: ''
      chunk_size_override:
        description: 'Optional: emails per Gemini call (default 1, most thorough). Raise this (e.g. 8-15) temporarily while clearing a large backlog, to conserve daily quota across many older emails'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install google-generativeai pypdf python-docx pytesseract pillow openpyxl python-pptx pymupdf requests

      - name: Restore cached database
        uses: actions/cache@v4
        with:
          path: dia_events.db
          key: dia-events-db-${{ github.run_id }}
          restore-keys: |
            dia-events-db-

      - name: Run ingestion
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REPROCESS_KEYWORD: ${{ github.event.inputs.force_reprocess_keyword }}
          FULL_REPROCESS: ${{ github.event.inputs.full_reprocess }}
          EMAIL_LIMIT_OVERRIDE: ${{ github.event.inputs.email_limit_override }}
          GEMINI_CHUNK_SIZE_OVERRIDE: ${{ github.event.inputs.chunk_size_override }}
        run: python3 -u ingest.py

      - name: Build board
        run: python3 build_board.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp board.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
